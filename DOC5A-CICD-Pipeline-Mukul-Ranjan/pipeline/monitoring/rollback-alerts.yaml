---
# NovaPay Digital Bank
# Day 8 — Rollback Monitoring / Prometheus Alert Rules
# File: rollback-alerts.yaml
#
# Purpose:
#   Detect production release failures and classify them into:
#     Category A = immediate rollback
#     Category B = escalate / evaluate rollback
#     Category C = manual decision (handled through operational process)
#
# IMPORTANT:
#   Metric names must match the instrumentation deployed in the cluster.
#   The rollback webhook/automation must be independent of the normal
#   deployment path, as required by the assessment.

groups:
  - name: novapay-rollback-category-a
    interval: 15s
    rules:

      # A1 — HTTP 5xx > 5% for 60 seconds
      - alert: NovaPayHigh5xxRate
        expr: |
          (
            sum(rate(http_requests_total{
              environment="production",
              status=~"5.."
            }[1m]))
            /
            clamp_min(
              sum(rate(http_requests_total{
                environment="production"
              }[1m])),
              0.001
            )
          ) > 0.05
        for: 60s
        labels:
          severity: critical
          rollback_category: A
          rollback_action: immediate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay production HTTP 5xx rate is above 5%"
          description: "HTTP 5xx error rate has exceeded 5% for 60 seconds."
          threshold: ">5% for 60s"
          action: "Immediate rollback to last known-good release."
          runbook: "rollback-specification.md"

      # A2 — Three consecutive health failures
      # Assumes the application exports a health check result metric.
      - alert: NovaPayHealthCheckFailures
        expr: |
          max_over_time(
            novapay_health_check_failures_total{
              environment="production"
            }[30s]
          ) >= 3
        for: 15s
        labels:
          severity: critical
          rollback_category: A
          rollback_action: immediate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay health checks failed three or more times"
          description: >
              Production health checks indicate
              repeated application failure.
          threshold: "3 consecutive health failures"
          action: "Immediate rollback."

      # A3 — OOMKill detected
      - alert: NovaPayOOMKilled
        expr: |
          increase(
            kube_pod_container_status_last_terminated_reason{
              namespace="novapay",
              reason="OOMKilled"
            }[2m]
          ) > 0
        for: 15s
        labels:
          severity: critical
          rollback_category: A
          rollback_action: immediate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay production container was OOMKilled"
          description: |
            A production application container has been terminated because
            of out-of-memory conditions.
          threshold: "OOMKilled detected"
          action: "Immediate rollback and investigate memory regression."

      # A4 — CrashLoopBackOff detected
      - alert: NovaPayCrashLoopBackOff
        expr: |
          max_over_time(
            kube_pod_container_status_waiting_reason{
              namespace="novapay",
              reason="CrashLoopBackOff"
            }[2m]
          ) == 1
        for: 30s
        labels:
          severity: critical
          rollback_category: A
          rollback_action: immediate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay production pod is in CrashLoopBackOff"
          description: "A production application pod is repeatedly crashing."
          threshold: "CrashLoopBackOff detected"
          action: "Immediate rollback."

      # A5 — DB connection pool exhaustion
      # Custom application metric expected from the
      #DB connection pool.
      - alert: NovaPayDBConnectionPoolExhausted
        expr: |
          (
            novapay_db_pool_in_use{
              environment="production"
            }
            /
            clamp_min(
              novapay_db_pool_max{
                environment="production"
              },
              1
            )
          ) >= 1
        for: 30s
        labels:
          severity: critical
          rollback_category: A
          rollback_action: immediate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay database connection pool is exhausted"
          description: >
                The application has consumed all
                available database connections.

          threshold: "Connection pool utilization >=100% for 30s"
          action: "Immediate rollback and protect database capacity."

      # A6 — Critical synthetic payment transaction failure
      - alert: NovaPaySyntheticPaymentFailure
        expr: |
          novapay_synthetic_payment_success{
            environment="production"
          } == 0
        for: 30s
        labels:
          severity: critical
          rollback_category: A
          rollback_action: immediate
          service: payments
          environment: production
        annotations:
          summary: "NovaPay synthetic payment transaction failed"
          description: >
                 A critical synthetic payment
                 transaction is failing in production.

          threshold: "Synthetic payment success == 0 for 30s"
          action: >
                Immediate rollback; verify no
                duplicate customer transactions.

  - name: novapay-rollback-category-b
    interval: 30s
    rules:

      # B1 — p99 latency > 2x baseline for 5 minutes
      - alert: NovaPayHighP99Latency
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{
                environment="production"
              }[5m])
            )
          )
          >
          2 * novapay:p99_baseline_seconds
        for: 5m
        labels:
          severity: warning
          rollback_category: B
          rollback_action: escalate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay p99 latency exceeds 2x baseline"
          description: >
                Production p99 latency has remained above
                twice the approved baseline for five minutes.

          threshold: ">2x baseline for 5m"
          action: "Page on-call; correlate release and evaluate rollback."

      # B2 — Error-budget burn > 10x for 10 minutes
      - alert: NovaPayErrorBudgetBurnTooHigh
        expr: |
          (
            1 -
            (
              sum(rate(http_requests_total{
                environment="production",
                status!~"5.."
              }[10m]))
              /
              clamp_min(
                sum(rate(http_requests_total{
                  environment="production"
                }[10m])),
                0.001
              )
            )
          )
          /
          0.001 > 10
        for: 10m
        labels:
          severity: warning
          rollback_category: B
          rollback_action: escalate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay error-budget burn exceeds 10x"
          description: >
                The observed error rate is consuming the 99.9% availability
                error budget at more than 10x the permitted rate.

          threshold: ">10x burn for 10m"
          action: >-
            Escalate; if no response within policy window, initiate rollback.

      # B3 — Transaction success >2% below baseline
      - alert: NovaPayTransactionSuccessDegraded
        expr: |
          novapay_transaction_success_rate{
            environment="production"
          }
          <
          (novapay:transaction_success_baseline * 0.98)
        for: 5m
        labels:
          severity: warning
          rollback_category: B
          rollback_action: escalate
          service: payments
          environment: production
        annotations:
          summary: "NovaPay transaction success rate is >2% below baseline"
          description: >
                Business transaction success has degraded beyond the
                approved rollback evaluation threshold.
          threshold: ">2% below baseline for 5m"
          action: "Page on-call; correlate deployment and payment health."

      # B4 — CPU >90% for 5 minutes
      - alert: NovaPayHighCPU
        expr: |
          (
            sum by (pod) (
              rate(container_cpu_usage_seconds_total{
                namespace="novapay",
                container!="",
                container!="POD"
              }[5m])
            )
            /
            clamp_min(
              sum by (pod) (
                kube_pod_container_resource_requests{
                  namespace="novapay",
                  resource="cpu",
                  unit="core"
                }
              ),
              0.001
            )
          ) > 0.90
        for: 5m
        labels:
          severity: warning
          rollback_category: B
          rollback_action: escalate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay production CPU exceeds 90%"
          description: >
                Application CPU consumption has remained above
                90% of requested capacity.

          threshold: ">90% for 5m"
          action: "Page on-call; investigate regression, capacity and rollback."

      # B5 — Memory >85% for 5 minutes
      - alert: NovaPayHighMemory
        expr: |
          (
            sum by (pod) (
              container_memory_working_set_bytes{
                namespace="novapay",
                container!="",
                container!="POD"
              }
            )
            /
            clamp_min(
              sum by (pod) (
                kube_pod_container_resource_limits{
                  namespace="novapay",
                  resource="memory",
                  unit="byte"
                }
              ),
              1
            )
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          rollback_category: B
          rollback_action: escalate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay production memory exceeds 85%"
          description: >
                Application memory usage has remained above
                85% of its configured limit.
          threshold: ">85% for 5m"
          action: >-
            Page on-call; investigate memory growth and evaluate rollback.

  - name: novapay-rollback-context
    interval: 30s
    rules:

      # Supporting alert: detects restart activity for correlation.
      - alert: NovaPayPodRestartSpike
        expr: |
          increase(
            kube_pod_container_status_restarts_total{
              namespace="novapay"
            }[5m]
          ) >= 3
        for: 1m
        labels:
          severity: warning
          rollback_category: B
          rollback_action: correlate
          service: novapay
          environment: production
        annotations:
          summary: "NovaPay pod restart activity increased"
          description: >
                Pod restarts increased and should be
                correlated with the current release.
          threshold: ">=3 restarts in 5m"
          action: >-
            Correlate deployment, Git SHA, image digest and application logs.

# Recording rules used by the alert rules above.
# Keep these in the same Prometheus rule file or load them before the alerts.
  - name: novapay-rollback-recording-rules
    interval: 30s
    rules:
      - record: novapay:p99_baseline_seconds
        expr: |
          avg_over_time(
            histogram_quantile(
              0.99,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{
                  environment="production"
                }[5m])
              )
            )[1h:5m]
          )

      - record: novapay:transaction_success_baseline
        expr: |
          avg_over_time(
            novapay_transaction_success_rate{
              environment="production"
            }[1h:5m]
          )
