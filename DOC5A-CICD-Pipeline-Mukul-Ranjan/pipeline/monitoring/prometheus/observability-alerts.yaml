## 8. Validation Before Production

Run Prometheus rule validation before applying the file:

```bash
promtool check rules prometheus/observability-alerts.yaml
```

Then validate the Kubernetes object:

```bash
kubectl apply --dry-run=client \
  -f prometheus/observability-alerts.yaml
```

After deployment:

```bash
kubectl -n monitoring get prometheusrule novapay-observability-alerts
```

Check Prometheus rules:

```bash
kubectl -n monitoring port-forward svc/prometheus-operated 9090:9090
```

Then inspect:

```text
http://localhost:9090/rules
```

For each critical alert, test the corresponding metric condition in a non-production environment before enabling automatic rollback.

