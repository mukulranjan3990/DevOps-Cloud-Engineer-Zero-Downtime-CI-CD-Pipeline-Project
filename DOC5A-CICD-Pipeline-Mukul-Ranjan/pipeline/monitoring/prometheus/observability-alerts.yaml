## 4. Alert Routing Contract

The rules intentionally attach machine-readable labels so Alertmanager can route them independently:

```yaml
severity:
  critical | warning | info

rollback_category:
  A | B

action:
  immediate-rollback
  escalate
  block-promotion
  regulatory-notification
  autoscaling-signal
```

Recommended routing:

```text
CRITICAL / Category A
        |
        +--> SRE Pager
        +--> Incident channel
        +--> Independent rollback controller
        +--> Audit evidence

WARNING / Category B
        |
        +--> On-call
        +--> Incident channel
        +--> Escalation timer
        +--> Rollback if policy requires

COMPLIANCE / SECURITY
        |
        +--> Compliance/Security
        +--> Release owner
        +--> Block promotion

REGULATORY
        |
        +--> Compliance
        +--> Incident Commander
        +--> Approved RBI notification workflow

INFO / Category C
        |
        +--> Dashboard
        +--> Incident channel when correlated
        +--> Human decision
```

Alertmanager routing remains responsible for notification, grouping, deduplication, inhibition and escalation. **Alertmanager itself should not be treated as the rollback engine.** The rollback action must use the independent rollback path defined by the Day 8 specification.

