## 6. SLO and Error Budget

NovaPay uses:

```text
Availability SLO = 99.9%

Allowed error rate = 0.1%

30-day error budget = 43.2 minutes

Burn Rate = Observed Error Rate / Allowed Error Rate
```

Example:

```text
Observed error rate = 1%
Allowed error rate  = 0.1%

Burn Rate = 10x
```

The assessment's rollback policy treats **>10x normal burn for 10 minutes** as a Category B escalation condition.

