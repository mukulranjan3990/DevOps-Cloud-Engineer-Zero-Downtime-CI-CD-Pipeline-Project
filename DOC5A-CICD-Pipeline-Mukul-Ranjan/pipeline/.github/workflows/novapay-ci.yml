---
name: NovaPay CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  JAVA_VERSION: "21"
  IMAGE_NAME: "novapay-payment"

jobs:
  # Stage 1
  source-validation:
    name: "1. Source & Trigger"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "Source validation placeholder"

  # Stage 2
  build-test:
    name: "2. Build & Unit Test"
    needs: source-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build and unit test
        run: |
          ./mvnw -B clean verify
          echo "Coverage gate: >=80% line, >=70% branch"
      - name: Build container
        run: docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .
      - name: Publish image placeholder
        run: echo "Push immutable image to approved registry"

  # Stage 3 — parallel with Stage 4
  sast:
    name: "3. SAST"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SonarQube analysis placeholder
        run: |
          echo "SonarQube scan"
          echo "Gate: 0 critical;"
          echo "Policy-compliant high findings;"
          echo "New-code debt <=5%"

  # Stage 4 — parallel with Stage 3
  dependency-container-scan:
    name: "4. Dependency & Container Scan"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan placeholder
        run: |
          echo "Trivy vulnerability scan"
          echo "Gate: Critical CVEs = 0; configured High/CVSS policy satisfied"
      - name: SBOM placeholder
        run: echo "Generate CycloneDX/SPDX SBOM"

  # Stage 5
  integration-contract:
    name: "5. Integration & Contract Testing"
    needs: [sast, dependency-container-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests placeholder
        run: echo "Testcontainers + PostgreSQL + Redis + RabbitMQ"
      - name: Pact tests placeholder
        run: echo "Consumer/provider contract tests"

  # Stage 6
  dast:
    name: "6. DAST"
    needs: integration-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP ZAP placeholder
        run: |
          echo "Passive + active + authenticated ZAP scan"
          echo "Gate: blocking Critical/High findings = 0"

  # Stage 7
  policy-compliance:
    name: "7. Policy & Compliance"
    needs: dast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OPA/Kyverno placeholder
        run: echo "Evaluate Kubernetes/security policies"
      - name: Cosign verification placeholder
        run: echo "Verify signed image"
      - name: Compliance gate placeholder
        run: |
          echo "RBI / PCI-DSS / SoD gate"
          echo "Production bypass prohibited"

  # Stage 8
  deploy-verify:
    name: "8. Deploy & Verify"
    needs: policy-compliance
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Argo CD deployment placeholder
        run: |
          echo "Trigger Argo CD"
          echo "Primary: blue-green; alternative: canary"
      - name: Verification placeholder
        run: |
          echo "Readiness/liveness"
          echo "Smoke tests"
          echo "Synthetic payment"
          echo "Prometheus SLO verification"
      - name: Rollback hook
        if: failure()
        run: echo "Rollback to last known-good release"
