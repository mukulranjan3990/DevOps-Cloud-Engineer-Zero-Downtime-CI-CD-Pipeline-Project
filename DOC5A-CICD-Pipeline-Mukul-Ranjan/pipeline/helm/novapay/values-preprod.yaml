---
# NovaPay Helm PRE-PROD override
# Data: masked production-data subset
# Access: QA + Compliance + DBA
# Trigger: manual approval after STAGING gates

environment: preprod

replicaCount: 4

image:
  # Same immutable artifact promoted from STAGING.
  tag: ""
  digest: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1500m"
    memory: "2Gi"

featureFlags:
  newPaymentFlow: true
  rolloutPercentage: 100

database:
  host: "novapay-postgresql-preprod"
  port: 5432
  name: "novapay_preprod"

logging:
  level: INFO

monitoring:
  enabled: true

deployment:
  strategy: RollingUpdate
  maxUnavailable: 0
  maxSurge: 1

secrets:
  provider: vault
  path: "secret/data/novapay/preprod"

dataPolicy:
  profile: masked-production-subset
  productionDataAllowed: false

compliance:
  uatRequired: true
  rbiVerificationRequired: true
  pciDssVerificationRequired: true
  dbMigrationValidationRequired: true
