---
# NovaPay Helm base configuration
# Day 7: same artifact, different configuration.
# Shared defaults for all environments.
# IMPORTANT: No plaintext secrets belong in this file.

environment: ""

image:
  repository: registry.example.com/novapay/payment
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

security:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

featureFlags:
  newPaymentFlow: false
  rolloutPercentage: 0

secrets:
  provider: vault
  # Secret values are retrieved at runtime from Vault.
  # Never put passwords, API keys, tokens, certificates or encryption keys here.

database:
  # Non-secret connection configuration only.
  host: ""
  port: 5432
  name: novapay

monitoring:
  enabled: true
  metricsPath: /metrics
  metricsPort: 9090

logging:
  level: INFO

health:
  readinessPath: /ready
  livenessPath: /health

deployment:
  strategy: RollingUpdate
  maxUnavailable: 0
  maxSurge: 1

driftDetection:
  managedBy: argocd
  checkInterval: 3m

# Service-specific overrides can be supplied by the chart/application layer.
serviceOverrides: {}
