{{- if and .Values.istio.enabled .Values.istio.virtualService.enabled }}

apiVersion: networking.istio.io/v1
kind: Gateway

metadata:
  name: {{ .Values.istio.gateway }}
  labels:
    {{- include "novapay.labels" . | nindent 4 }}

spec:
  selector:
    istio: ingressgateway

  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP

      hosts:
        - {{ .Values.istio.virtualService.host | quote }}

{{- end }}